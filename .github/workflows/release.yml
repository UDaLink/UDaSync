name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 版本号（留空则读取 package.json）
        required: false
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Resolve version
        id: meta
        run: |
          VERSION="${{ inputs.version }}"
          if [ -z "$VERSION" ]; then
            VERSION=$(node -p "require('./package.json').version")
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build extension
        run: npm run build

      - name: Package extension
        run: |
          cd dist
          zip -qr "../UDaSync-${{ steps.meta.outputs.version }}.zip" .

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: UDaSync-${{ steps.meta.outputs.version }}
          path: UDaSync-${{ steps.meta.outputs.version }}.zip
          if-no-files-found: error

      - name: Create GitHub Release
        if: steps.meta.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v${{ steps.meta.outputs.version }}" \
            "UDaSync-${{ steps.meta.outputs.version }}.zip" \
            --target "$GITHUB_SHA" \
            --title "UDaSync v${{ steps.meta.outputs.version }}" \
            --notes-file .github/release-notes.md
